[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic_ai_analysis"

version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "accelerate>=1.12.0",
    "arxiv>=2.4.0",
    "bitsandbytes>=0.48.1,<0.49",
    "datasets>=4.6.1",
    "langchain>=1.0.0,<2",
    "langchain-community>=0.4,<0.5",
    "langchain-core>=1.2.16",
    "langchain-huggingface>=1.0.0,<2",
    "langchain-openai>=1.1.10",
    "langgraph>=1.0.10",
    "matplotlib>=3.10.8",
    "mmd-tst-variable-detector",
    "numpy>=1.24.2",
    "protobuf>=7.34.0",
    "pydantic>=2.12.5",
    "scikit-learn>=1.8.0",
    "seaborn",
    "sentence-transformers>=5.2.3",
    "submitit>=1.5.4",
    "vllm",
]

[tool.hatch.build.targets.sdist]
include = ["agentic_ai_analysis"]

[tool.hatch.build.targets.wheel]
include = [
    "agentic_ai_analysis",
]

[tool.uv.sources]
mmd-tst-variable-detector = { git = "https://github.com/Kensuke-Mitsuzawa/mmd-two-sample-test-variable-selection.git" }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
